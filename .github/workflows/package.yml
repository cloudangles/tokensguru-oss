name: Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  install-smoke-test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv smoke
          source smoke/bin/activate 2>/dev/null || source smoke/Scripts/activate
          python -m pip install dist/*.whl

      - name: Run the installed command
        env:
          PYTHONUTF8: "1"
        run: |
          source smoke/bin/activate 2>/dev/null || source smoke/Scripts/activate
          tokensguru --version
          tokensguru version
          tokensguru info
