name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          # pytest exits with 5 when no tests are collected yet; allow that
          # until src/tests contains tests.
          pytest src/tests || [ $? -eq 5 ]
