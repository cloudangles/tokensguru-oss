name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          # src/tests is not tracked in git until it contains files, so skip
          # cleanly when it is missing. pytest exits with 5 when the folder
          # exists but no tests are collected yet; allow that too.
          if [ ! -d src/tests ]; then
            echo "src/tests does not exist yet; skipping tests."
            exit 0
          fi
          pytest src/tests || [ $? -eq 5 ]
