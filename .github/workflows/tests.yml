name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is not provided on ubuntu-latest (Ubuntu 26.04), so it runs on 22.04.
        include:
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    env:
      # Box-drawing characters must print on Windows consoles too.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test tools
        run: python -m pip install -e ".[test]"

      - name: Run tests with coverage (fails under 80%)
        run: python -m pytest --cov --cov-report=term-missing
