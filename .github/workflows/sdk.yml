name: Python SDK
on:
  push:
    paths: ['tokenguru-client/**', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['tokenguru-client/**', '.github/workflows/sdk.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install ./tokenguru-client
      - run: python -m unittest discover -s tokenguru-client/tests -v
  package-and-langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './tokenguru-client[langchain]' build twine
      - run: python -m unittest discover -s tokenguru-client/tests -v
      - run: python -m build tokenguru-client
      - run: python -m twine check tokenguru-client/dist/*
