name: Commit Message Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,72}$'
          status=0
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Invalid commit subject: $subject"
              status=1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA" | grep -v -E '^(Revert )' || true)
          if [[ $status -ne 0 ]]; then
            echo "Commit subjects must follow COMMIT_MESSAGES.md, e.g. 'fix(client): retry on 429 responses'."
          fi
          exit $status
