[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensguru"
dynamic = ["version"]
description = "Reduce LLM token usage and cost."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "CloudAngles", email = "cloudangles@cloudangles.com"}]
keywords = ["llm", "tokens", "cost", "optimization"]

[project.urls]
Homepage = "https://github.com/cloudangles/tokensguru-oss"
Repository = "https://github.com/cloudangles/tokensguru-oss"
Issues = "https://github.com/cloudangles/tokensguru-oss/issues"

[project.scripts]
tokensguru = "tokensguru.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "tokensguru.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-exclude = ["tokenguru-client"]
