[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensguru"
dynamic = ["version"]
description = "Reduce LLM token usage and cost."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "CloudAngles", email = "cloudangles@cloudangles.com"}]
keywords = ["llm", "tokens", "cost", "optimization"]

[project.optional-dependencies]
# Needed to run the test suite (CI installs this).
test = ["pytest>=8", "pytest-cov>=5"]
# Everything needed to lint, type-check, test, build and audit locally.
dev = [
    "tokensguru[test]",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/cloudangles/tokensguru-oss"
Repository = "https://github.com/cloudangles/tokensguru-oss"
Issues = "https://github.com/cloudangles/tokensguru-oss/issues"

[project.scripts]
tokensguru = "tokensguru.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "tokensguru.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py39"
# tokenguru-client/ is a separate SDK that does not meet these rules yet.
extend-exclude = ["tokenguru-client"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear (likely bugs)
    "UP",       # pyupgrade (modern syntax)
    "SIM",      # simplifications
    "C4",       # comprehensions
    "RUF",      # ruff-specific checks
    "PTH",      # pathlib over os.path
    "PL",       # pylint checks
    "RET",      # return statements
    "ARG",      # unused arguments
    "S",        # security (bandit-style)
]

[tool.ruff.lint.per-file-ignores]
"src/tests/*" = ["S101", "PLR2004", "ARG001", "ARG002", "ARG005"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
mypy_path = "src"
files = ["src/tokensguru"]

# ---------------------------------------------------------------------------
# Tests and coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/tokensguru"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
