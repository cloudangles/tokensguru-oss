# Local checks that mirror the CI pipeline.
# Install once:  pip install pre-commit && pre-commit install && pre-commit install --hook-type commit-msg
# The hooks use the tools installed in your environment (make install), so versions match CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: python -m mypy
        language: system
        pass_filenames: false
        files: ^src/tokensguru/

      - id: commit-message
        name: commit message format
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]
        always_run: true
