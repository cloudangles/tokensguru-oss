[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensight-oss"
version = "0.1.0"
description = "TokenSight OSS SDK -- core AI observation/instrumentation for LLM applications"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
cohere = ["cohere>=5.0"]
litellm = ["litellm>=1.0"]

[tool.setuptools.packages.find]
include = ["tokensight_oss*"]

[tool.setuptools.package-data]
tokensight_oss = ["pricing.json"]
